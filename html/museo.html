<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Museo Pokémon | Galería de Exhibición</title>
    <link rel="stylesheet" href="../css/museo.css">
</head>
<body>

    <!-- OVERLAY OBLIGATORIO DE ORIENTACIÓN HORIZONTAL (MÓVIL VERTICAL) -->
    <div id="orientation-warning">
        <div class="phone-icon-wrapper">
            <div class="phone-icon"></div>
        </div>
        <h2 class="warning-title">Modo Horizontal Requerido</h2>
        <p class="warning-text">Por favor, gira tu dispositivo a posición horizontal (Landscape) para ingresar a la exhibición inmersiva del Museo Pokémon.</p>
    </div>

    <div class="game-wrapper">
        <!-- PANTALLA DE CARGA REDUCIDA PARA NAVEGACIÓN DIRECTA -->
        <div id="pantalla-loading">
            <div class="museum-header-badge">Colección Privada</div>
            <h1 class="museum-title-main">MUSEO POKÉMON</h1>

            <div class="gif-container">
                <img src="../img/loading.gif" alt="Cargando Museo Pokémon" onerror="this.style.display='none';">
                <div class="gif-fallback-spinner"></div>
            </div>

            <div class="loading-status-text" id="loading-status-text">Cargando colección...</div>

            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <button class="btn-enter-museum" id="btn-enter">
                ENTRAR AL PASILLO
            </button>
        </div>

        <!-- EL PASILLO HORIZONTAL DEL MUSEO -->
        <div id="pantalla-museo" class="oculto">
            <div class="category-bar-wrapper">
                <div class="category-bar" id="category-bar"></div>
            </div>
            <div id="museum-bg" class="bg-sala1"></div>
            <canvas id="bg-particles"></canvas>
            <div class="spotlight-beam"></div>
            <div class="museum-floor-line"></div>
            <div class="scanlines-overlay"></div>
            
            <div id="gallery-track"></div>

            <div class="swipe-hint">&lt; Arrastra horizontalmente para recorrer las salas &gt;</div>

            <div class="museum-ui-bar">
                <button class="nav-btn" id="btn-prev" title="Carta Anterior">◄</button>
                <div class="exhibit-counter" id="exhibit-counter">OBRA 1 DE --</div>
                <button class="nav-btn" id="btn-next" title="Siguiente Carta">►</button>
            </div>
        </div>
    </div>

    <script src="../js/museo.js"></script>
</body>
</html>
